schema_version = "1.3"

[metadata]
name = "airflow-dag-debugger"
description = "Debug a production Airflow DAG with 4 silent scheduling bugs that cause missed runs, scheduler flooding, wrong time windows, and worker starvation."

[environment]
dockerfile = "environment/Dockerfile"

[verifier]
timeout_sec = 600.0
environment_mode = "shared"

[agent]
timeout_sec = 900.0
