schema_version = "1.3"

[metadata]
name = "h2o-polars-skew-debugger"
description = "Debug a production ML pipeline where training uses Pandas/H2O but serving uses Polars, causing silent train/serve skew in feature engineering."

[environment]
dockerfile = "environment/Dockerfile"

[verifier]
timeout_sec = 600.0
environment_mode = "shared"

[agent]
timeout_sec = 900.0
