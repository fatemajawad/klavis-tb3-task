[task]
name = "dbt-incremental-debugger"
version = "1.0.0"
description = """
A dbt project processes user event data with an incremental model. The model has been
deployed to production but stakeholders report that downstream dashboards show stale data,
duplicate records, and unexpected row counts after each refresh. No errors are thrown.
Your job is to find and fix all bugs in the incremental model SQL so the verifier passes.
"""
author = "Fatima Jawad"
difficulty = "hard"
domain = ["data-engineering", "dbt", "sql", "incremental-models"]
tags = ["dbt", "sql", "incremental", "debugging", "data-quality"]

[environment]
dockerfile = "environment/Dockerfile"

[solution]
dockerfile = "solution/Dockerfile"

[verifier]
dockerfile = "tests/Dockerfile"
reward_file = "/logs/verifier/reward.txt"
