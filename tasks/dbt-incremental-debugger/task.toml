version = "1.0"

[metadata]
name = "dbt-incremental-debugger"
description = "Debug a dbt incremental model with 3 silent SQL bugs causing stale data and soft-delete leakage."

[environment]
dockerfile = "environment/Dockerfile"
build_timeout_sec = 600.0

[solution]
dockerfile = "solution/Dockerfile"

[verifier]
dockerfile = "tests/Dockerfile"
reward_file = "/logs/verifier/reward.txt"
timeout_sec = 900.0

[agent]
timeout_sec = 900.0
